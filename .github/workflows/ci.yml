name: Study CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: study-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  study:
    name: Study (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Verify runtime
        env:
          EXPECTED_PYTHON: ${{ matrix.python }}
        run: python -c "import os, platform; assert platform.python_version().startswith(os.environ['EXPECTED_PYTHON'])"
      - name: Install verification dependencies
        run: python -m pip install --only-binary :all: -r requirements-ci.txt
      - name: Test invariants and oracle parity (standalone runner)
        run: python tools/run_tests.py
      - name: Test invariants and oracle parity (pytest)
        run: python -m pytest -q
      - name: Run examples
        run: |
          python example_routing.py
          python example_journey_profiles.py
          python example_walking_tradeoff.py
      - name: Execute notebooks from clean kernels
        run: python tools/verify_notebooks.py
